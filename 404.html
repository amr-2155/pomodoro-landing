<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الصفحة غير موجودة — Pomodoro Pro</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E1020">
<link rel="icon" type="image/svg+xml" href="images/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--primary:#6C63FF;--primary-dark:#4E4BC8;--primary-light:#8B83FF;--accent:#FF6584;--success:#34A853}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;min-height:100vh;display:grid;place-items:center;text-align:center;padding:2rem;
  color:#fff;
  background:radial-gradient(1000px 500px at 80% -5%,rgba(108,99,255,.45),transparent),radial-gradient(800px 500px at 10% 110%,rgba(255,101,132,.28),transparent),linear-gradient(180deg,#141736,#0E1020 70%)}
.card{max-width:560px}
.badge{display:inline-flex;align-items:center;gap:.5rem;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);padding:.4rem 1rem;border-radius:100px;font-size:.85rem;font-weight:700;color:#D9D7FF}
h1{font-size:clamp(2.4rem,8vw,4.5rem);font-weight:900;line-height:1.1;margin:1rem 0 .4rem;background:linear-gradient(90deg,#A79FFF,#FF6584);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:#B9BDD6;font-size:1.1rem;margin-bottom:1.8rem}
.btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:.6rem;padding:.9rem 2rem;border-radius:100px;font-weight:800;font-size:1rem;text-decoration:none;transition:.3s}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:0 12px 32px rgba(108,99,255,.5)}
.btn-primary:hover{transform:translateY(-3px)}
.btn-ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.2)}
.btn-ghost:hover{background:rgba(255,255,255,.16);transform:translateY(-3px)}
.ring{width:96px;height:96px;margin:0 auto 1.2rem;border-radius:50%;border:8px solid rgba(52,168,83,.35);border-top-color:#34A853;display:grid;place-items:center;font-size:2.2rem}
</style>
</head>
<body>
<div class="card">
  <div class="ring">📿</div>
  <div class="badge">خطأ 404</div>
  <h1>الصفحة غير موجودة</h1>
  <p>يبدو أن الرابط الذي تحاول الوصول إليه غير متاح. لا تقلق — ابدأ وردك من هنا.</p>
  <div class="btns">
    <a class="btn btn-primary" href="https://amr-2155.github.io/pomodoro-landing/">🏠 الصفحة الرئيسية</a>
    <a class="btn btn-ghost" href="https://amr-2155.github.io/pomodoro-pro/">🚀 ابدأ الآن</a>
  </div>
</div>
</body>
</html>
